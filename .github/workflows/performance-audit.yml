name: USAJIO performance audit

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'assets/**'
      - 'lighthouserc*.json'
      - '.github/workflows/performance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Lighthouse CI and static server
        run: npm install --no-save @lhci/cli http-server
      - name: Run Lighthouse on homepage and all calculators
        run: npx lhci autorun --config=lighthouserc.${{ matrix.profile }}.json
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.profile }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
